baseURL = "https://fundingdb.123factory.de/"
title = "Funding DB — 한국 기업을 위한 유럽 R&D 지원사업"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
timeZone = "Europe/Berlin"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
# Populate .Lastmod from git so the machine-readable program feed can expose a
# reliable "last updated" date without manual front-matter upkeep. CI checks out
# full history (fetch-depth: 0), so this resolves correctly on deploy.
enableGitInfo = true

[params]
description = "Horizon Europe, Eurostars, 한-독 공동기술개발 등 한국 기업이 지원할 수 있는 유럽·독일 R&D 지원사업을 한국어로 정리한 데이터베이스입니다."
googleTagId = "G-SC48CT0M8S"

[markup.goldmark.renderer]
unsafe = true

# Emphasis (**bold**) fails to close when the ** sits between punctuation and a
# Korean character, e.g. (브뤼셀)**입니다 (CommonMark right-flanking rule).
# escapedSpace lets content use "**\ " — a backslash-escaped space that closes
# the emphasis and is removed from the output.
[markup.goldmark.extensions.cjk]
enable = true
escapedSpace = true

[outputs]
home = ["HTML"]
# The programs section also emits index.json — a machine-readable feed at
# /programs/index.json for other agents to discover programs by added/updated date.
section = ["HTML", "JSON"]
