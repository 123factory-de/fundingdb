<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — Funding DB{{ end }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ site.Home.RelPermalink }}">Funding<em>DB</em></a>
    <nav class="site-nav">
      <a href="{{ site.Home.RelPermalink }}" {{ if or .IsHome (eq .Section "programs") }}class="on"{{ end }}>지원사업</a>
      <a href="{{ "compare/" | relURL }}" {{ if eq .Layout "compare" }}class="on"{{ end }}>한눈에 비교</a>
      <a href="{{ "about/" | relURL }}" {{ if eq (path.Base .RelPermalink) "about" }}class="on"{{ end }}>이용 안내</a>
    </nav>
    <a class="by" href="https://www.123factory.de/" target="_blank" rel="noopener">123 FACTORY</a>
  </div>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <div class="container">
    <p>본 사이트는 공식 공고를 요약한 참고 자료입니다. 지원 요건과 일정은 반드시 각 사업의 공식 공고에서 최종 확인하세요.</p>
    <p>© <a href="https://www.123factory.de/" target="_blank" rel="noopener">123 Factory</a></p>
  </div>
</footer>
{{ $js := resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
