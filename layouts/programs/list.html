{{ define "main" }}
<div class="container">
  <section class="hero">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </section>
  <div class="searchbar">
    <input type="search" id="q" placeholder="사업명·분야·지원대상으로 검색 (예: 기후, 바이오, 중소기업)" autocomplete="off" spellcheck="false" aria-label="지원사업 검색">
  </div>
  <div class="filters">
    <button class="chip on" data-filter="all" type="button">전체</button>
    <button class="chip" data-filter="horizon" type="button">Horizon Europe</button>
    <button class="chip" data-filter="eureka" type="button">Eureka</button>
    <button class="chip" data-filter="bilateral" type="button">양자협력</button>
    <label class="open-toggle"><input type="checkbox" id="open-only">모집중만 보기</label>
  </div>
  <div class="grid">
    {{ range partial "sorted-programs.html" . }}
      {{ partial "program-card.html" . }}
    {{ end }}
  </div>
  <p class="no-results" hidden>검색 결과가 없습니다. 다른 검색어나 필터를 시도해 보세요.</p>
</div>
{{ end }}
